<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B5C">
<meta name="description" content="香港出门路线：现在出门搭哪一班最快，全部方案、车费、最坏情况。">
<title>搭哪班｜香港出门路线</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6B5C'/%3E%3Cpath d='M18 44V22a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v22' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M18 32h28' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='24' cy='46' r='4' fill='%23fff'/%3E%3Ccircle cx='40' cy='46' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Layout: one narrow column, a sticky bar, the decision for "leave now" first, the full list below. */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --sunken: #E8EDEA; --ink: #13201B; --muted: #5A6A63; --line: #D9E0DC;
  --accent: #0E6B5C; --accent-ink: #FFFFFF; --accent-soft: #DCEFEA;
  --good: #17724A; --warn: #A85B00; --warn-soft: #FFF1DC; --bad: #B3261E;
  --seg-walk: #9AA8A1; --seg-wait: #E0A33A; --seg-ride: #0E6B5C; --seg-red: #D4574E; --seg-dwell: #7FB7AB; --seg-rail: #2D6FB8; --seg-taxi: #C8102E;
  --radius: 14px; --gap: 12px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang SC", "Microsoft JhengHei", "Microsoft YaHei", "Noto Sans CJK TC", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1412; --surface: #17201C; --sunken: #111916; --ink: #E7EEEA; --muted: #9BAAA2; --line: #2A3631;
    --accent: #4CC5AE; --accent-ink: #05211B; --accent-soft: #173B34;
    --good: #5FD39A; --warn: #F0B45A; --warn-soft: #3A2C12; --bad: #FF8A80;
    --seg-walk: #6B7A73; --seg-wait: #D29A3A; --seg-ride: #4CC5AE; --seg-red: #E06A61; --seg-dwell: #3E8275; --seg-rail: #5B9BE0; --seg-taxi: #E0425A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: 0; z-index: 20; background: var(--accent); color: var(--accent-ink);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.brand { font-size: 18px; font-weight: 700; letter-spacing: .02em; background: none; border: 0; color: inherit; padding: 6px 0; }
.bar .grow { flex: 1; }
.bar .link { background: none; border: 0; color: inherit; padding: 8px 8px; border-radius: 8px; font-size: 14px; opacity: .92; }
.bar .link[aria-current="page"] { background: rgba(255,255,255,.18); opacity: 1; }
@media (prefers-color-scheme: dark) { .bar .link[aria-current="page"] { background: rgba(0,0,0,.18); } }

main { max-width: 560px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: var(--gap); }
h2 { font-size: 16px; margin: 8px 0 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowx { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* trip form */
.od { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.od .fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.place { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--sunken); border: 1px solid transparent;
  border-radius: 10px; padding: 11px 12px; min-height: 46px; }
.place .tag { flex: none; width: 1.6em; color: var(--muted); font-size: 13px; }
.place .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.place .val.empty { color: var(--muted); font-weight: 400; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.when { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.when select, .when input { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); width: 100%; min-height: 48px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: none; color: var(--accent); border: 1px solid var(--line); font-weight: 600; }
.btn.slim { width: auto; padding: 8px 12px; min-height: 38px; font-size: 14px; border-radius: 10px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li + li { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 11px 2px; min-height: 46px; }
.item .t { min-width: 0; flex: 1; }
.item .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.item .t span { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: none; color: var(--muted); padding: 8px; font-size: 16px; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.notice.err { border-left: 4px solid var(--bad); }

/* badges: operators' own colours, so each carries its own text colour */
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 7px; padding: 2px 8px; font-weight: 700; font-size: 14px; line-height: 1.5; white-space: nowrap;
  background: var(--sunken); color: var(--ink); font-variant-numeric: tabular-nums; }
.badge small { font-weight: 500; font-size: 11.5px; opacity: .9; }
.b-kmb { background: #D7141A; color: #fff; }
.b-ctb { background: #FFD60A; color: #0B2C6B; }
.b-kmbctb { background: linear-gradient(100deg, #D7141A 0 52%, #FFD60A 52% 100%); color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.55); }
.b-gmb { background: #0B8A4A; color: #FFFBE6; }
.b-nlb { background: #F08A24; color: #1E1300; }
.b-lrtfeeder, .b-lightRail { background: #8A6D00; color: #fff; }
.b-ferry { background: #1D62B0; color: #fff; }
.b-taxi { background: #C8102E; color: #fff; }
.b-walk { background: var(--sunken); color: var(--ink); }
.b-mtr { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); padding: 1px 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.sep { color: var(--muted); padding: 0 2px; }
.names { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 3px; min-width: 0; }

/* hero: the decision if you leave now */
.hero { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.hero .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.hero .take { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; }
.hero .take .badge { font-size: 17px; padding: 3px 10px; }
.hero .arrive { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero .arrive .big { font-size: 34px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; background: var(--accent-soft); color: var(--ink); }
.pill.hot { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.alt { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; }
.alt + .alt { border-top: 1px solid var(--line); }
.alt .at { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.alt .d { text-align: right; color: var(--muted); font-size: 12.5px; }
.alt .how { color: var(--muted); font-size: 13px; grid-column: 1; }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.status .bad { color: var(--bad); }

/* option cards */
.opt { display: flex; flex-direction: column; gap: 10px; }
.metrics { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); }
.metrics b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
.segbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken); }
.segbar i { display: block; min-width: 2px; }
.s-walk { background: var(--seg-walk); } .s-wait { background: var(--seg-wait); } .s-ride { background: var(--seg-ride); }
.s-red { background: var(--seg-red); } .s-dwell { background: var(--seg-dwell); } .s-rail { background: var(--seg-rail); } .s-taxi { background: var(--seg-taxi); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.steps { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.steps li span { display: block; color: var(--muted); font-size: 13px; }
.flag { color: var(--warn); font-size: 13.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
details > summary { cursor: pointer; list-style: none; font-weight: 600; padding: 4px 0; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "＋"; float: right; color: var(--muted); }
details[open] > summary::after { content: "－"; }
.exc { padding: 9px 0; font-size: 14px; }
.exc + .exc { border-top: 1px solid var(--line); }
.exc .why { color: var(--muted); font-size: 13px; }

/* trip log */
.ev { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 11px 0; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev .lab { font-weight: 600; }
.ev.done .lab { color: var(--muted); font-weight: 500; }
.ev .meta { color: var(--muted); font-size: 12.5px; grid-column: 1; }
.ev .time { font-weight: 700; font-variant-numeric: tabular-nums; background: none; border: 0; padding: 6px 4px; text-decoration: underline dotted; }
.ev input[type=time] { background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.ev.next { background: var(--accent-soft); margin: 0 -14px; padding: 12px 14px; }
.ev.next + .ev { border-top: 0; }
.counter { display: flex; align-items: center; gap: 10px; }
textarea { width: 100%; min-height: 76px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
input[type=text], input[type=search] { width: 100%; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }

/* place picker */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.sheet-head { background: var(--accent); color: var(--accent-ink); padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); }
.sheet-head .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.sheet-head input { flex: 1; border: 0; background: var(--surface); color: var(--ink); min-width: 0; }
.sheet-head button { background: none; border: 0; color: inherit; padding: 8px; font-weight: 600; }
.sheet-body { flex: 1; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-body > div { max-width: 560px; margin: 0 auto; }
.grp { font-size: 12.5px; color: var(--muted); padding: 12px 2px 2px; letter-spacing: .04em; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.center { text-align: center; padding: 28px 8px; color: var(--muted); }
.spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 10px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0 0 8px; padding-left: 20px; }
.foot { color: var(--muted); font-size: 12.5px; }
.langs { display: flex; gap: 6px; }
</style>
</head>
<body>
<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="app"><div class="center"><div class="spin"></div><span id="boot">正在载入线路数据…</span></div></main>
<noscript><p style="padding:16px">这个页面需要开启 JavaScript。This page needs JavaScript.</p></noscript>

<script src="i18n.js"></script>
<script src="i18n.hant.js"></script>
<script src="planner.js"></script>
<script src="app.js"></script>
</body>
</html>
